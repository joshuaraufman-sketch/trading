[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Research-first AI-assisted systematic trading laboratory"
requires-python = ">=3.11"

dependencies = [
    "alpaca-py",
    "numpy",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
