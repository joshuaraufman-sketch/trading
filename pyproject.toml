[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Research-first AI-assisted systematic trading laboratory"
requires-python = ">=3.11"

dependencies = [
    "alpaca-py==0.44.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "matplotlib==3.11.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
